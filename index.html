<style>
:root{--navy:#15333e;--ink:#1d2939;--sub:#667085;--line:#d5dde6}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;background:#eef2f6;color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
header{background:var(--navy);color:#fff;padding:22px 18px 26px;text-align:center}
header img{width:84px;height:84px;border-radius:22px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
header h1{margin:12px 0 2px;font-size:26px;letter-spacing:-.5px}
header p{margin:0;opacity:.75;font-size:14px}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:18px 16px 10px}
a.app{display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px 18px;margin:0 0 12px;box-shadow:0 3px 0 #c9d4e3;transition:transform .08s}
a.app:active{transform:translateY(2px);box-shadow:0 1px 0 #c9d4e3}
a.app .ic{font-size:40px;width:52px;text-align:center;flex-shrink:0}
a.app b{display:block;font-size:21px;letter-spacing:-.3px}
a.app small{display:block;color:var(--sub);font-size:14px;margin-top:2px}
a.app.big{background:linear-gradient(180deg,#f2fbf6,#e2f5ea);border-color:#3e9d7a;padding:22px 20px}
a.app.big b{font-size:26px;color:#0b5c41}
a.app.big .ic{font-size:50px}
h2{font-size:14px;color:var(--sub);margin:20px 4px 8px;font-weight:700}
a.app.dis{opacity:.45;pointer-events:none}
footer{text-align:center;color:var(--sub);font-size:12px;padding:14px 10px 22px}
</style></head><body>
